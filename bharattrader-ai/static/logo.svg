<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="saffronGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cyanGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Outer Tech Circuit Ring -->
  <circle cx="250" cy="230" r="180" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="250" cy="230" r="165" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.5"/>

  <!-- Candlestick Graphic Silhouette -->
  <g opacity="0.35">
    <rect x="130" y="210" width="8" height="50" rx="2" fill="#10B981"/>
    <line x1="134" y1="190" x2="134" y2="280" stroke="#10B981" stroke-width="2"/>
    
    <rect x="155" y="180" width="8" height="70" rx="2" fill="#10B981"/>
    <line x1="159" y1="160" x2="159" y2="270" stroke="#10B981" stroke-width="2"/>

    <rect x="335" y="190" width="8" height="60" rx="2" fill="#06B6D4"/>
    <line x1="339" y1="170" x2="339" y2="270" stroke="#06B6D4" stroke-width="2"/>

    <rect x="360" y="160" width="8" height="85" rx="2" fill="#10B981"/>
    <line x1="364" y1="140" x2="364" y2="265" stroke="#10B981" stroke-width="2"/>
  </g>

  <!-- Stylized Tiger (Left) & Bull (Right) Emblem -->
  <!-- Tiger Silhouette (Saffron / Amber) -->
  <path d="M 160 270 C 140 240, 130 190, 170 160 C 190 145, 210 150, 225 170 C 235 185, 240 210, 220 240 C 205 260, 180 275, 160 270 Z" 
        fill="none" stroke="url(#saffronGold)" stroke-width="5" filter="url(#neonGlow)"/>
  <path d="M 180 180 L 205 200 L 195 225 L 175 210 Z" fill="rgba(245, 158, 11, 0.2)" stroke="url(#saffronGold)" stroke-width="2"/>
  <circle cx="190" cy="195" r="5" fill="#FFD700" filter="url(#neonGlow)"/>

  <!-- Wall Street Bull Horns & Head (Cyan / Emerald) -->
  <path d="M 275 170 C 290 150, 310 145, 330 160 C 370 190, 360 240, 340 270 C 320 275, 295 260, 280 240 C 260 210, 265 185, 275 170 Z" 
        fill="none" stroke="url(#cyanGreen)" stroke-width="5" filter="url(#neonGlow)"/>
  <path d="M 295 200 L 320 180 L 325 210 L 305 225 Z" fill="rgba(16, 185, 129, 0.2)" stroke="url(#cyanGreen)" stroke-width="2"/>
  <circle cx="310" cy="195" r="5" fill="#06B6D4" filter="url(#neonGlow)"/>

  <!-- Center Breakthrough Surge Arrow -->
  <path d="M 210 280 L 250 170 L 290 280 L 250 250 Z" fill="url(#saffronGold)" filter="url(#neonGlow)"/>
  <circle cx="250" cy="165" r="8" fill="#FFFFFF" filter="url(#neonGlow)"/>
  
  <!-- Circuit Nodes -->
  <line x1="250" y1="110" x2="250" y2="155" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="250" cy="105" r="5" fill="#F59E0B"/>
  
  <line x1="140" y1="280" x2="110" y2="310" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <circle cx="105" cy="315" r="4" fill="#06B6D4"/>
  
  <line x1="360" y1="280" x2="390" y2="310" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <circle cx="395" cy="315" r="4" fill="#10B981"/>

  <!-- Branding Typography -->
  <text x="250" y="380" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">
    BHARAT<tspan fill="url(#saffronGold)">TRADER</tspan> <tspan fill="#06B6D4">AI</tspan>
  </text>
  <text x="250" y="415" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-weight="600" font-size="13" letter-spacing="3" fill="#94A3B8" text-anchor="middle">
    AUTONOMOUS QUANTITATIVE APEX
  </text>
  <text x="250" y="440" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="10" letter-spacing="2" fill="#10B981" text-anchor="middle">
    SUB-SECOND LOSS SUPPRESSION · 24/7
  </text>
</svg>
